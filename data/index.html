<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32 Web Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>北寺尾ガレージシャッターボタン</h1>

  <p>照明リレー　ポジション: <strong> %STATE%</strong></p>

  <!-- 🔴 UP：確認付き -->
  <p>
    <button class="button" onclick="confirmUp()">上昇</button>
  </p>

  <!-- 通常操作 -->
  <p><a href="/stop"><button class="button button2">停止</button></a></p>
  <p><a href="/down"><button class="button">下降</button></a></p>
  <p><a href="/led"><button class="button button3">LED</button></a></p>

  <!-- ログ -->
  <hr style="margin-top:30px;">
  <p><a href="/logs"><button class="button button4">📑 ログを見る</button></a></p>

  <!-- ✅ 確認用 JavaScript -->
  <script>
    function confirmUp() {
      if (confirm("⚠ 本当にシャッターを上昇させますか？\n機器が動作します。")) {
        location.href = "/up";
      }
    }
  </script>

</body>
</html>
