<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>GarageControl ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="login.css">
</head>
<body>
  <div class="card">
    <h1>GarageControl ログイン</h1>
    <div id="err" class="error">ユーザー名またはパスワードが違います。</div>

    <form method="POST" action="/login" autocomplete="on">
      <input type="hidden" name="redirect" id="redirect">
      <label>
        ユーザー名
        <input
          type="text"
          name="username"
          id="username"
          required
          inputmode="email"
          autocomplete="username">
      </label>
      <label>
        パスワード
        <input
          type="password"
          name="password"
          id="password"
          required
          autocomplete="current-password">
      </label>
      <button type="submit">ログイン</button>
    </form>

    <div class="meta">
      <a href="/" title="トップへ戻る">トップページ</a>
      <span>この通信は暗号で保護されていません</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("err") === "1") document.getElementById("err").style.display = "block";
    const redir = params.get("redirect") || "/";
    document.getElementById("redirect").value = redir;
    document.getElementById("username").focus();
  </script>
</body>
</html>
